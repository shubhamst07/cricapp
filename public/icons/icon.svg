<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Cricket Ball Circle with shadow -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="145" fill="url(#ballGrad)" />

    <!-- Cricket Ball Seam Stitching (Curved) -->
    <path d="M 180 145 C 235 210, 235 302, 180 367" fill="none" stroke="#e11d48" stroke-width="8" stroke-linecap="round" stroke-dasharray="8,6" />
    <path d="M 332 145 C 277 210, 277 302, 332 367" fill="none" stroke="#e11d48" stroke-width="8" stroke-linecap="round" stroke-dasharray="8,6" />

    <!-- Central Global / Live Cricket Axis -->
    <ellipse cx="256" cy="256" rx="55" ry="144" fill="none" stroke="#6366f1" stroke-width="6" stroke-dasharray="6,6" opacity="0.6" />
    <line x1="112" y1="256" x2="400" y2="256" stroke="#6366f1" stroke-width="6" opacity="0.6" />
  </g>

  <!-- Live Pulse Dot in Top Right -->
  <circle cx="395" cy="115" r="24" fill="#22c55e" filter="url(#glow)" />
  <circle cx="395" cy="115" r="34" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.75" />
</svg>
